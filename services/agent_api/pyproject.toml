[project]
name = "agent-api"
version = "0.1.0"
description = "DB Ops agent-api: conversations, agent runs and pass-through to the mock backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "PyYAML>=6",
    "boto3",
    "strands-agents[litellm]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_api"]
