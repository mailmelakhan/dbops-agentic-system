[project]
name = "dbops-frontend"
version = "0.1.0"
description = "DB Ops Streamlit frontend (part 1)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.67,<2",
    "httpx>=0.28",
    "pandas>=2.2",
    "bcrypt>=4.2",
    "PyYAML>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbops_frontend"]
