[project]
name = "db-ops"
version = "0.1.0"
description = "DB Ops part 1: contracts, mock backend and Streamlit frontend"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "openapi-spec-validator>=0.7",
    "jsonschema>=4.23",
    "bcrypt>=4.2",
    "PyYAML>=6",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = []

[tool.pytest.ini_options]
testpaths = ["tests", "mock_backend/tests", "frontend/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py312"
