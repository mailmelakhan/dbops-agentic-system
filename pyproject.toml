[project]
name = "db-ops"
version = "0.1.0"
description = "DB Ops part 1: contracts, mock backend and Streamlit frontend"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "mock-backend",
    "dbops-frontend",
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.8",
    "openapi-spec-validator>=0.7",
    "jsonschema>=4.23",
    "bcrypt>=4.2",
    "PyYAML>=6",
]

[tool.uv]
package = false

[tool.uv.sources]
mock-backend = { workspace = true }
dbops-frontend = { workspace = true }

[tool.uv.workspace]
members = ["mock_backend", "frontend"]

[tool.pytest.ini_options]
testpaths = ["tests", "mock_backend/tests", "frontend/tests"]
addopts = "--import-mode=importlib"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
target-version = "py312"
