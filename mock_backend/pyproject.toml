[project]
name = "mock-backend"
version = "0.1.0"
description = "In-memory mock of agent-api, executor and health-analytics for DB Ops part 1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "PyYAML>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_backend"]
